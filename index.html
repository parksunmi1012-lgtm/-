<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>박선미 | 디지털 명함</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      /* KB Style: 1 Main Color (Warm Deep Charcoal Brown) + 1 Point Color (KB Gold) + White/Gray */
      --main-dark: #2C2620;
      --main-mid: #433B32;
      --main-light: #594F43;
      --point-color: #C98A00;
      --point-soft: rgba(201, 138, 0, 0.10);

      --bg-page: #F2F2F0;
      --bg-frame: #F7F7F5;
      --bg-card: #FBFBF9;
      --surface-white: #FFFFFF;
      --text-primary: #1C1C1E;
      --text-secondary: #68686E;
      --text-muted: #98989F;
      --border-hairline: #EBEBE8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text-primary);
      background: linear-gradient(145deg, #FFF7DF 0%, #FFF1C2 50%, #FCE395 100%);
      overflow: hidden;
    }

    .viewport-wrapper {
      width: 100%;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Phone Frame: 9:16 ratio, max-width 430px, 100dvh on mobile, rounded frame on desktop */
    .phone-frame {
      position: relative;
      width: 100%;
      max-width: 430px;
      height: 100dvh;
      background: linear-gradient(165deg, #FFF3C4 0%, #FFE078 52%, #FFBC00 100%);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    @media (min-width: 480px) {
      .phone-frame {
        height: min(94dvh, 860px);
        width: auto;
        aspect-ratio: 9 / 16;
        max-width: 430px;
        border-radius: 38px;
        box-shadow:
          0 32px 72px rgba(44, 38, 32, 0.18),
          0 12px 28px rgba(44, 38, 32, 0.10),
          inset 0 0 0 1px rgba(255, 255, 255, 0.85);
      }
    }

    /* Subtle ambient radial glows: top-right & bottom-left */
    .ambient-glow-tr {
      position: absolute;
      top: -70px;
      right: -70px;
      width: 240px;
      height: 240px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.55) 0%, rgba(255, 255, 255, 0) 70%);
      pointer-events: none;
      z-index: 0;
    }

    .ambient-glow-bl {
      position: absolute;
      bottom: -80px;
      left: -80px;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(166, 108, 0, 0.16) 0%, rgba(166, 108, 0, 0) 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* Top Bar */
    .top-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: calc(14px + env(safe-area-inset-top)) 22px 24px;
      background: linear-gradient(
        to bottom,
        rgba(255, 255, 255, 0.92) 0%,
        rgba(255, 255, 255, 0.65) 55%,
        rgba(255, 255, 255, 0) 100%
      );
      pointer-events: none;
    }

    .back-btn {
      pointer-events: auto;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid rgba(0, 0, 0, 0.08);
      background: #FFFFFF;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-primary);
      transition: transform 0.16s ease, box-shadow 0.16s ease;
    }

    .back-btn:active {
      transform: scale(0.92);
    }

    .top-title-group {
      text-align: right;
      pointer-events: auto;
    }

    .top-title-ko {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.2;
      letter-spacing: -0.02em;
    }

    .top-title-en {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.32em;
      color: #8A5A00;
      margin-top: 2px;
      margin-right: -0.32em;
    }

    /* Scrollable Card Area (scrollbar hidden) */
    .scroll-area {
      position: relative;
      z-index: 1;
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: none;
      -ms-overflow-style: none;
      padding: calc(76px + env(safe-area-inset-top)) 16px calc(92px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .scroll-area::-webkit-scrollbar {
      display: none;
    }

    /* Business Card */
    .card {
      position: relative;
      width: 100%;
      max-width: 372px;
      background: var(--bg-card);
      border-radius: 30px;
      box-shadow:
        0 26px 56px rgba(44, 38, 32, 0.14),
        0 10px 22px rgba(44, 38, 32, 0.06),
        0 0 0 1px rgba(255, 255, 255, 0.9);
      overflow: hidden;
      padding-bottom: 14px;
      opacity: 0;
      transform: translateY(72px);
      animation: cardEnter 1.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes cardEnter {
      0% {
        opacity: 0;
        transform: translateY(72px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /*Diagonal light sweep across the card*/
    .card::after {
      content: '';
      position: absolute;
      top: -20%;
      left: -130%;
      width: 65%;
      height: 150%;
      background: linear-gradient(
        105deg,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0.08) 38%,
        rgba(255, 255, 255, 0.36) 50%,
        rgba(255, 255, 255, 0.08) 62%,
        rgba(255, 255, 255, 0) 100%
      );
      transform: skewX(-18deg);
      pointer-events: none;
      z-index: 15;
      animation: cardShine 2.1s cubic-bezier(0.25, 0.8, 0.25, 1) 0.7s forwards;
    }

    @keyframes cardShine {
      0% {
        left: -130%;
      }
      100% {
        left: 165%;
      }
    }

    /* 1) Header Band */
    .card-header-band {
      position: relative;
      height: 168px;
      background: linear-gradient(135deg, var(--main-dark) 0%, var(--main-mid) 52%, var(--main-light) 100%);
      padding: 26px 24px;
      overflow: hidden;
    }

    /* 2 subtle circular glows at corners */
    .card-header-band::before {
      content: '';
      position: absolute;
      top: -45px;
      right: -35px;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.14) 0%, rgba(255, 255, 255, 0) 70%);
      pointer-events: none;
    }

    .card-header-band::after {
      content: '';
      position: absolute;
      bottom: -55px;
      left: -30px;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(201, 138, 0, 0.18) 0%, rgba(201, 138, 0, 0) 70%);
      pointer-events: none;
    }

    .brand-en-title {
      position: relative;
      z-index: 2;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 30px;
      font-weight: 600;
      letter-spacing: 0.14em;
      color: #FFFFFF;
      line-height: 1.1;
    }

    .brand-en-sub {
      position: relative;
      z-index: 2;
      font-size: 9.5px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.44em;
      color: rgba(255, 255, 255, 0.72);
      margin-top: 6px;
    }

    /* 2) White Sheet overlapping band by 38px */
    .card-sheet {
      position: relative;
      z-index: 5;
      margin: -38px 11px 0;
      background: var(--surface-white);
      border-radius: 25px;
      box-shadow:
        0 10px 28px rgba(44, 38, 32, 0.08),
        0 2px 6px rgba(44, 38, 32, 0.03);
      padding: 62px 20px 22px;
    }

    /* 3) Profile Photo: 100px circle, 4px white border, centered at top -50px */
    .profile-photo-wrap {
      position: absolute;
      top: -50px;
      left: 50%;
      transform: translateX(-50%);
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 4px solid #FFFFFF;
      box-shadow: 0 8px 20px rgba(44, 38, 32, 0.16);
      overflow: hidden;
      background: #EAEAE6;
    }

    .profile-photo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 15%;
      display: block;
    }

    /* 4) Name + Role */
    .identity-block {
      text-align: center;
      margin-bottom: 20px;
    }

    .user-name {
      font-size: 24px;
      font-weight: 900;
      color: var(--text-primary);
      letter-spacing: -0.02em;
      line-height: 1.25;
    }

    .user-tagline {
      margin-top: 6px;
      font-size: 12.5px;
      color: var(--text-secondary);
      line-height: 1.4;
    }

    .user-role {
      color: var(--point-color);
      font-weight: 700;
    }

    /* 5) 4 Action Buttons Grid */
    .action-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 20px;
    }

    .action-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: inherit;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      font-family: inherit;
    }

    .action-icon-box {
      width: 51px;
      height: 51px;
      border-radius: 15px;
      background: #F6F6F4;
      border: 1px solid #ECECE8;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--main-dark);
      transition: transform 0.15s ease, background-color 0.15s ease, border-color 0.15s ease;
    }

    .action-item:active .action-icon-box {
      transform: scale(0.93);
      background: var(--point-soft);
      border-color: rgba(201, 138, 0, 0.3);
    }

    .action-label {
      margin-top: 7px;
      font-size: 11.5px;
      font-weight: 500;
      color: var(--text-secondary);
    }

    /* 6) Hairline Divider */
    .divider-1px {
      height: 1px;
      width: 100%;
      background: var(--border-hairline);
      margin-bottom: 4px;
    }

    /* 7) Info List */
    .info-list {
      display: flex;
      flex-direction: column;
    }

    .info-item {
      padding: 13px 2px;
      border-bottom: 1px solid var(--border-hairline);
    }

    .info-item:last-child {
      border-bottom: none;
      padding-bottom: 2px;
    }

    .info-link {
      display: block;
      text-decoration: none;
      color: inherit;
      transition: opacity 0.15s ease;
    }

    .info-link:active {
      opacity: 0.65;
    }

    .info-label {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .info-value {
      font-size: 15px;
      font-weight: 500;
      color: var(--text-primary);
      line-height: 1.48;
      word-break: keep-all;
    }

    .info-value .line-lead {
      font-weight: 700;
      display: block;
    }

    .info-value .line-sub {
      display: block;
      color: var(--text-secondary);
      font-size: 14px;
      margin-top: 2px;
    }

    /* Floating Share Button */
    .share-fab {
      position: absolute;
      right: 20px;
      bottom: calc(20px + env(safe-area-inset-bottom));
      z-index: 25;
      width: 54px;
      height: 54px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, var(--main-dark) 0%, var(--main-light) 100%);
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 10px 24px rgba(44, 38, 32, 0.28),
        0 4px 10px rgba(44, 38, 32, 0.16);
      cursor: pointer;
      opacity: 0;
      transform: translateY(28px);
      animation: fabEnter 0.7s cubic-bezier(0.16, 1, 0.3, 1) 1.2s forwards;
      transition: transform 0.15s ease;
    }

    @keyframes fabEnter {
      0% {
        opacity: 0;
        transform: translateY(28px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .share-fab:active {
      transform: scale(0.92);
    }

    /* Toast Message */
    .toast {
      position: absolute;
      left: 50%;
      bottom: calc(86px + env(safe-area-inset-bottom));
      transform: translateX(-50%) translateY(12px);
      z-index: 40;
      background: rgba(44, 38, 32, 0.92);
      color: #FFFFFF;
      font-size: 13px;
      font-weight: 500;
      padding: 10px 18px;
      border-radius: 999px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.18);
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>

            <path d="M15 18l-6-6 6-6" />

                  <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

            <!-- 7) Info List -->
            <div class="info-list">
              <div class="info-item">
                <a class="info-link" href="tel:010-6316-2790">
                  <div class="info-label">휴대폰번호</div>

              <div class="info-item">
                <a class="info-link" href="mailto:3278053@kbinsure.co.kr">
                  <div class="info-label">메일</div>
                  <div class="info-value">3278053@kbinsure.co.kr</div>
                </a>
              </div>

              <div class="info-item">
                <div class="info-label">직무/직책</div>
                <div class="info-value">
                  <span class="line-lead">TA코치 · 보장분석전문가</span>
                </div>
              </div>

              <div class="info-item">
                <div class="info-label">전문분야</div>
                <div class="info-value">디지털보장분석컨설팅 전문가</div>

              <div class="info-item">
                <div class="info-label">보유자격</div>
                <div class="info-value">
                  <span class="line-lead">손해보험자격보유</span>
                  <span class="line-sub">생명보험자격보유</span>

      <!-- Floating Share Button -->
      <button type="button" class="share-fab" id="shareBtn" aria-label="명함 공유하기">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="18" cy="5" r="3" />
          <circle cx="6" cy="12" r="3" />
          <circle cx="18" cy="19" r="3" />
          <line x1="8.59" y1="13.51" x2="15.42" y2="17.49" />
          <line x1="15.41" y1="6.51" x2="8.59" y2="10.49" />
        </svg>
      </button>

      <!-- Toast Notification -->
      <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    (function () {
      const toastEl = document.getElementById('toast');
      const saveBtn = document.getElementById('saveContactBtn');
      const shareBtn = document.getElementById('shareBtn');
      const backBtn = document.getElementById('backBtn');
      const scrollArea = document.getElementById('scrollArea');
      let toastTimer = null;

      function showToast(message) {
        toastEl.textContent = message;
        toastEl.classList.add('show');
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(function () {
          toastEl.classList.remove('show');
        }, 2400);
      }

      // Back button behavior
      backBtn.addEventListener('click', function () {
        if (window.history.length > 1 && document.referrer) {
          window.history.back();
        } else {
          scrollArea.scrollTo({ top: 0, behavior: 'smooth' });
          showToast('명함 첫 화면입니다');
        }
      });

      // vCard (.vcf) download
      saveBtn.addEventListener('click', function () {
        const vcfLines = [
          'BEGIN:VCARD',
          'VERSION:3.0',
          'FN:박선미',
          'N:박;선미;;;',
          'ORG:KB손해보험',
          'TITLE:TA코치 · 보장분석전문가',
          'TEL;TYPE=CELL:010-6316-2790',
          'EMAIL;TYPE=WORK:3278053@kbinsure.co.kr',
          'NOTE:디지털보장분석컨설팅 전문가 / 손해보험·생명보험·제3보험 자격보유',
          'END:VCARD'
        ];
        const vcfContent = vcfLines.join('\r\n');
        const blob = new Blob([vcfContent], { type: 'text/vcard;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = '박선미_디지털명함.vcf';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        setTimeout(function () {
          URL.revokeObjectURL(url);
        }, 1000);
        showToast('연락처가 저장되었습니다');
      });

      // Share button (navigator.share with clipboard fallback)
      function copyFallback(text) {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.setAttribute('readonly', '');
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();
        let copied = false;
        try {
          copied = document.execCommand('copy');
        } catch (err) {
          copied = false;
        }
        document.body.removeChild(textarea);
        return copied;
      }

      shareBtn.addEventListener('click', async function () {
        const shareUrl = window.location.href;
        const shareData = {
          title: '박선미 | 디지털 명함',
          text: 'KB손해보험 박선미 (TA코치 · 보장분석전문가)',
          url: shareUrl
        };

        if (navigator.share) {
          try {
            await navigator.share(shareData);
            return;
          } catch (err) {
            if (err && err.name === 'AbortError') return;
          }
        }

        if (navigator.clipboard && navigator.clipboard.writeText) {
          try {
            await navigator.clipboard.writeText(shareUrl);
            showToast('명함 주소가 복사되었습니다');
            return;
          } catch (err) {
            // fallback below
          }
        }

        if (copyFallback(shareUrl)) {
          showToast('명함 주소가 복사되었습니다');
        } else {
          showToast('주소를 복사할 수 없습니다');
        }
      });
    })();
  </script>
</body>
